<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Yet the Butterflies Flutter Away | Psychological Visual Novel</title>
  <meta name="description" content="A psychological drama, dark fantasy, and tragedy visual novel about General Joan, his beloved wife Aflania, and the insidious manipulation of Lieutenant Laqquo.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="asset/items/butterfly_brooch.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Custom VN Style & DDLC FX -->
  <link rel="stylesheet" href="src/css/style.css">

  <!-- High Priority Asset Preloading for Instant Gameplay Responsiveness -->
  <link rel="preload" as="image" href="Backgrounds/Balcony.jpg">
  <link rel="preload" as="image" href="asset/character_Laqquo/Laqquo_happy.png">
  <link rel="preload" as="image" href="asset/character_alfania/Alfania_happy.png">
  <link rel="preload" as="image" href="asset/items/butterfly_brooch.png">
</head>
<body class="bg-slate-950 text-slate-100 antialiased overflow-hidden select-none">
  <!-- Main Viewport: Fullscreen native layout for Mobile, Tablet, and Desktop -->
  <main id="app" class="relative w-screen h-[100dvh] overflow-hidden select-none">
    <!-- 1. Layered Background System -->
    <div id="backgroundContainer" class="absolute inset-0 z-0 pointer-events-none"></div>

    <!-- 2. Dynamic Paranoia Vignette (Darkens into deep purple / Abyss black) -->
    <div id="paranoiaVignette" class="absolute inset-0 z-10 pointer-events-none transition-all duration-700"></div>

    <!-- 3. Interactive Silver Butterfly Particle System (HTML5 Canvas) -->
    <canvas id="particleCanvas" class="absolute inset-0 z-15 pointer-events-none"></canvas>

    <!-- 4. Character Sprites Layer (First-Person POV: Interlocutors centered facing player) -->
    <div id="characterContainer" class="absolute inset-0 z-20 pointer-events-none flex items-end justify-center overflow-hidden"></div>

    <!-- 5. Top Route Indicator & HUD Control Bar -->
    <header id="hudContainer" class="absolute top-0 inset-x-0 z-30 w-full pt-safe pointer-events-auto"></header>

    <!-- 6. Bottom Interactive Stage (Dialogue Box + Cinders Question & Horizontal Choice Row) -->
    <div id="bottomStage" class="absolute bottom-0 inset-x-0 z-30 w-full max-w-5xl mx-auto pb-safe px-3 md:px-6 pb-3 md:pb-5 flex flex-col items-center justify-end pointer-events-auto gap-2">
      <!-- Dialogue Box Container -->
      <footer id="dialogueContainer" class="w-full pointer-events-auto transition-all duration-300"></footer>

      <!-- Choice Decision Overlay (Question Bar + Horizontal Choice Row) -->
      <section id="choiceContainer" class="w-full pointer-events-auto hidden transition-all duration-300" aria-label="Player Choices"></section>
    </div>

    <!-- 8. Interactive Modals (Higher than Main Menu & Game) -->
    <aside id="itemModalContainer" class="fixed inset-0 z-[60] pointer-events-none [&>*]:pointer-events-auto"></aside>
    <aside id="historyModalContainer" class="fixed inset-0 z-[60] pointer-events-none [&>*]:pointer-events-auto"></aside>
    <aside id="saveLoadModalContainer" class="fixed inset-0 z-[60] pointer-events-none [&>*]:pointer-events-auto"></aside>
    <aside id="optionsModalContainer" class="fixed inset-0 z-[60] pointer-events-none [&>*]:pointer-events-auto"></aside>
    <aside id="endingModalContainer" class="fixed inset-0 z-[60] pointer-events-none [&>*]:pointer-events-auto"></aside>
    <aside id="endingsGalleryModalContainer" class="fixed inset-0 z-[60] pointer-events-none [&>*]:pointer-events-auto"></aside>
    <aside id="creditsModalContainer" class="fixed inset-0 z-[65] pointer-events-none [&>*]:pointer-events-auto"></aside>

    <!-- 9. Main Menu Title Screen Layer (Active before game starts, above game stage, below modals) -->
    <div id="mainMenuContainer" class="absolute inset-0 z-[45] pointer-events-auto"></div>

    <!-- 10. Cinematic Scene Transition Fade-to-Black Overlay -->
    <div id="sceneTransitionOverlay" class="fixed inset-0 z-[70] pointer-events-none opacity-0 transition-opacity duration-500 bg-slate-950 flex flex-col items-center justify-center"></div>
  </main>

  <!-- Visual Novel Engine Scripts -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
